; ALOX Vision Core - settings of the simulated demo machine (alox --simulate). Synthetic values only.
; Copied to <settings>/alox.ini at the first start (python -m alox.devices.scene --make-demo DIR writes the folders).
[general]
language_STR = "en"
profile_STR = "DEMO"
coretype_I32 = 0
wafersize_DBL = 76.200000
bowingAngle_DBL = 45.000000
bowingOffset_DBL = 3.000000
setLEDcam_I32 = 1
camera_U32 = 0
saveOverlay_BOOL = TRUE
saveOverlayRes_BOOL = TRUE

[heartbeat]
frequency_I32 = 1000

; text overlays of Get Image, sized for the 612 x 512 simulated frames
[overlays]
fontsize_I32 = 13
fontlinespace_I32 = 15
fontcolor_STR = "3399FF"

[hardware.camera]
lightStatusInverter_BOOL = FALSE

[hardware.camera.highmag]
name_STR = "HighMag"
exposure_STR = "CameraAttributes::AcquisitionControl::ExposureTime"
exposuretype_STR = "DBL"
exposureunits_STR = "us"
gain_STR = "CameraAttributes::AnalogControl::Gain"
gaintype_STR = "DBL"
Gain_DBL = 1.000000
framerate_STR = "CameraAttributes::AcquisitionControl::AcquisitionFrameRate"
frameratetype_STR = "DBL"
frameratemax_DBL = 40.000000
LimitMinExposure_DBL = 100.000000
pixelsize_DBL = 0.680000
units_I32 = 1
hflip_BOOL = FALSE
vflip_BOOL = FALSE
flatfieldcorrection_BOOL = FALSE

[hardware.camera.lowmag]
name_STR = "LowMag"
exposure_STR = "CameraAttributes::AcquisitionControl::ExposureTime"
exposuretype_STR = "DBL"
exposureunits_STR = "us"
gain_STR = "CameraAttributes::AnalogControl::Gain"
gaintype_STR = "DBL"
Gain_DBL = 1.000000
framerate_STR = "CameraAttributes::AcquisitionControl::AcquisitionFrameRate"
frameratetype_STR = "DBL"
frameratemax_DBL = 40.000000
LimitMinExposure_DBL = 100.000000
pixelsize_DBL = 2.720000
units_I32 = 1
hflip_BOOL = FALSE
vflip_BOOL = FALSE
flatfieldcorrection_BOOL = FALSE

[hardware.xy]
stagescoordsys_U32 = 0
waferxorg_DBL = 100.000000
waferyorg_DBL = 100.000000
chuckxorg_DBL = 100.000000
chuckyorg_DBL = 100.000000
speed_DBL = 100.000000
slowspeed_DBL = 10.000000
waferlimit_BOOL = FALSE

[hardware.z]
zmin_DBL = 0.000000
zmax_DBL = 25.000000
speed_DBL = 5.000000
slowspeed_DBL = 1.000000
zminautofocus_DBL = 12.300000
zmaxautofocus_DBL = 12.700000
fastaflatency_DBL = 0.020000

[hardware.chuck]
maxparallelism_DBL = 100.000000
dz1_DBL = 0.000000
dz2_DBL = 0.000000
dz3_DBL = 0.000000
dz4_DBL = 0.000000
dz5_DBL = 0.000000
bowchuckA_DBL = 0.000000
bowchuckB_DBL = 0.000000

[log]
savemesadata_BOOL = TRUE
savemesaimages_BOOL = TRUE
savebowingdata_BOOL = TRUE
savebowingimages_BOOL = TRUE
savetiltdata_BOOL = TRUE
savetiltimages_BOOL = TRUE

; the demo's operator may run every function from the window (no password: the Engineer and Admin logins are
; refused without user.password.*)
[user.rights.operator]
exitapp_BOOL = TRUE
createprofile_BOOL = TRUE
deleteprofile_BOOL = TRUE
editprofile_BOOL = TRUE
changeprofile_BOOL = TRUE
editproperties_BOOL = TRUE
getimage_BOOL = TRUE
getimagesetup_BOOL = TRUE
autofocus_BOOL = TRUE
autofocussetup_BOOL = TRUE
refocus_BOOL = TRUE
refocussetup_BOOL = TRUE
refocusoxyd_BOOL = TRUE
refocusoxydsetup_BOOL = TRUE
detectcircle_BOOL = TRUE
detectcirclesetup_BOOL = TRUE
tracking_BOOL = TRUE
trackingsetup_BOOL = TRUE
measureoxyd_BOOL = TRUE
measureoxydsetup_BOOL = TRUE
searchwavelength_BOOL = TRUE
searchwavelengthsetup_BOOL = TRUE
searchobject_BOOL = TRUE
searchobjectsetup_BOOL = TRUE
autoexposure_BOOL = TRUE
autoexposuresetup_BOOL = TRUE
bowing_BOOL = TRUE
bowingsetup_BOOL = TRUE
tilt_BOOL = TRUE
tiltsetup_BOOL = TRUE
mesa_BOOL = TRUE
mesasetup_BOOL = TRUE

; The simulated wafer (alox.devices.scene.SceneParams; any field can be set here).
[simulation.scene]
seed_I32 = 7
image_width_I32 = 612
image_height_I32 = 512
frame_rate_max_DBL = 40.000000
tilt_deg_DBL = 0.300000
mesa_diameter_um_DBL = 30.000000
mesa_pitch_um_DBL = 250.000000
aperture_start_um_DBL = 24.000000
oxidation_rate_um_min_DBL = 0.500000
z_focus_mm_DBL = 12.600000
bowing_um_DBL = 20.000000
chuck_dz_mm_DBL = -0.250000
contrast_peak_nm_DBL = 850.000000
marks_STR = "cross,-0.5,0.0;corner,0.5,0.0"
; the XY stage starts on the mesa at the wafer centre (wafer mm): the operator's SINGLESHOT / CONTINUOUS MEASURE
; (no Move Start, no Search Object) measure the mesa under the camera
stage_start_x_mm_DBL = 0.000000
stage_start_y_mm_DBL = 0.000000
