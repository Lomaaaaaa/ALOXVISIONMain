[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alox"
version = "0.3.0"
description = "Python rewrite of ALOX Vision Core (LabVIEW): the integrated application and the camera server reference"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
stage = ["pyserial>=3.5"]         # the real PI Z stage (phase 2); pipython is not used
dev = ["pytest>=7.4", "pyserial>=3.5"]   # camera SDK extras are added in phase 3

[project.scripts]
alox = "alox.app:main"
aloxcam = "aloxcam.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aloxcam = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: end-to-end tests with a live server on loopback",
    "slow: > 2 s",
    "sim_only(reason): Z stage tests that apply to SimStage only (skipped for the FakeC663 parameter)",
]
