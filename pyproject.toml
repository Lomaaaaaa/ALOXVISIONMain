[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alox"
version = "0.3.0"
description = "Python rewrite of ALOX Vision Core (LabVIEW): the integrated application and the camera server reference"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pillow>=10"]   # scipy: circle and oxide-rate fits (alox.vision); pillow: overlays, JPEG (alox.core.images)

[project.optional-dependencies]
stage = ["pyserial>=3.5"]         # the PI stages (Z, XY); pipython is not used
api = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12"]   # REST (8002) and websocket (6123) for the supervisor
ui = ["PySide6>=6.6"]             # the operator window (alox.ui; python -m alox.ui)
licence = ["cryptography>=42"]       # the signed licence file (alox.licence), only when the check is enabled
vision = ["opencv-python-headless>=4.8"]   # alox.vision.matching: the OpenCV pattern matcher (NumPy fallback without)
dev = ["pytest>=7.4", "pyserial>=3.5", "fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "httpx>=0.27",
       "cryptography>=42"]

[project.scripts]
alox = "alox.app:main"
aloxcam = "aloxcam.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aloxcam = ["data/*.toml"]
alox = ["devices/scene_demo/*.ini"]   # the simulation demo (alox.devices.scene --make-demo)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools", "tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: end-to-end tests with a live server on loopback",
    "slow: > 2 s",
    "sim_only(reason): Z stage tests that apply to SimStage only (skipped for the FakeC663 parameter)",
]
